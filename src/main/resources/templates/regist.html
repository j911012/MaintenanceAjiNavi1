<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店舗登録</title>
    <link rel="stylesheet" th:href="@{/css/mt-top.css}">
    <link rel="stylesheet" th:href="@{/css/regist.css}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>店舗登録</h1>
            <p class="subtitle">MaintenanceAjiNavi</p>

            <form class="regist-form" th:action="@{/shop/regist/confirm}" th:object="${shopRegistForm}" method="post">
                <div class="form-group">
                    <label for="restaurantName">店舗名</label>
                    <input th:field="*{restaurantName}">
					<p class="error" th:if="${#fields.hasErrors('restaurantName')}" th:errors="*{restaurantName}"></p>
                </div>
                <div class="form-group">
                    <label for="catchPhrase">キャッチフレーズ</label>
                    <input th:field="*{catchPhrase}">
					<p class="error" th:if="${#fields.hasErrors('catchPhrase')}" th:errors="*{catchPhrase}"></p>
                </div>

                <div class="button-group">
                    <a href="/mt-top" class="menu-button secondary">もどる</a>
                    <button type="submit" class="menu-button">確認画面へ</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
